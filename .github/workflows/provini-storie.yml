name: Estrai provini copertine storie Deborah

on:
  push:
    paths:
      - ".github/workflows/provini-storie.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provini:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source videos
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages pillow
      - name: Extract original frame candidates and contact sheets
        run: python3 scripts/estrai_provini_storie.py
      - name: Publish review images and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/storie/provini/
          if git diff --cached --quiet; then
            echo "Frame candidates already current"
          else
            git commit -m "assets: publish original video stills and contact sheets for cover selection"
            git push origin HEAD:main
          fi
