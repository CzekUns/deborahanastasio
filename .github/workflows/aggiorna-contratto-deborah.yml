name: Aggiorna contratto Deborah (una tantum)
on:
  push:
    paths:
      - ".github/workflows/aggiorna-contratto-deborah.yml"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dependencies
        run: python3 -m pip install --break-system-packages pymupdf pillow cairosvg
      - name: Update contract PDF and website preview
        run: |
          python3 - <<'PY'
          import io
          from pathlib import Path
          import fitz
          import cairosvg
          from PIL import Image, ImageDraw, ImageFont

          pdf_path = Path("assets/documenti/Contratto_Deborah_Anastasio.pdf")
          preview_path = Path("assets/documenti/contratto-anteprima.webp")
          logo_svg = Path("assets/brand/stella-v3/DA-chiaro.svg")

          # The previously approved one-page contract is already present in Git.
          doc = fitz.open(str(pdf_path))
          assert len(doc) == 1
          page = doc[0]
          paper = (252/255, 250/255, 247/255)

          # Erase the outdated circular seal from the handwritten-music box.
          page.draw_rect(fitz.Rect(442.5, 477.5, 538.2, 573.5),
                         color=None, fill=paper, overlay=True)
          rule = (229/255, 221/255, 211/255)
          for y in (496.49, 516.89, 537.29, 557.69):
              page.draw_line(fitz.Point(442.5,y), fitz.Point(535.28,y),
                             color=rule, width=.57, overlay=True)

          # Recreate the site's DA-chiaro emblem inside its burgundy roundel,
          # using the approved vector asset and 11-degree tilt.
          s = 916
          stamp = Image.new("RGBA",(s,s),(0,0,0,0))
          draw = ImageDraw.Draw(stamp)
          draw.ellipse((75,75,841,841), fill=(81,21,46,255),
                       outline=(162,129,137,255), width=6)
          draw.ellipse((88,88,828,828), outline=(255,248,238,255), width=18)
          symbol_png = cairosvg.svg2png(bytestring=logo_svg.read_bytes(),
                                       output_width=635,output_height=438)
          symbol = Image.open(io.BytesIO(symbol_png)).convert("RGBA")
          stamp.alpha_composite(symbol,(140,145))
          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font=ImageFont.truetype(font_path,51)
          text="DEBORAH"
          box=draw.textbbox((0,0),text,font=font)
          draw.text(((916-(box[2]-box[0]))/2,617),text,
                    font=font,fill=(255,248,238,255))
          stamp=stamp.rotate(11,Image.Resampling.BICUBIC,expand=False)
          stamp_buffer=io.BytesIO()
          stamp.save(stamp_buffer,format="PNG")
          page.insert_image(fitz.Rect(54.5,31,126.5,103),
                            stream=stamp_buffer.getvalue(),overlay=True)

          tmp=pdf_path.with_suffix(".tmp.pdf")
          doc.save(str(tmp), garbage=4, deflate=True)
          doc.close()
          tmp.replace(pdf_path)

          verify=fitz.open(str(pdf_path))
          assert len(verify)==1 and "LE SPESE SIAE" in verify[0].get_text()
          pix=verify[0].get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False)
          image=Image.frombytes("RGB",(pix.width,pix.height),pix.samples)
          image.resize((440,622),Image.Resampling.LANCZOS).save(
              preview_path,format="WEBP",quality=87,method=6)
          verify.close()
          print("PDF and site preview updated:", pdf_path.stat().st_size,
                preview_path.stat().st_size)
          PY
      - name: Commit replacement to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documenti/Contratto_Deborah_Anastasio.pdf assets/documenti/contratto-anteprima.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: replace Deborah contract with approved branded edition"
            git push origin HEAD:main
          fi
